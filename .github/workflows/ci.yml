name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · migrations, lint, tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bytenews_test
          POSTGRES_USER: bytenews
          POSTGRES_PASSWORD: bytenews
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bytenews -d bytenews_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://bytenews:bytenews@localhost:5432/bytenews_test
      TEST_DATABASE_URL: postgresql+psycopg://bytenews:bytenews@localhost:5432/bytenews_test
      JWT_SECRET_KEY: ci-only-secret-key-that-is-at-least-32-bytes-long
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply Alembic migrations to a clean database
        run: alembic upgrade head

      - name: Static analysis (ruff, critical rules)
        # F = pyflakes errors, S = security checks. F821 is ignored because
        # SQLAlchemy relationships use string forward references.
        run: ruff check app --select F,S --ignore F821,S105,S106

      - name: Run tests with coverage
        run: >-
          pytest
          --cov=app
          --cov-report=term
          --cov-report=xml
          --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend · type check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Production build (static export)
        run: npm run build
