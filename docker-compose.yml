services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bytenews
      POSTGRES_USER: bytenews
      POSTGRES_PASSWORD: bytenews
    ports:
      - "5433:5432"
    volumes:
      - bytenews-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bytenews -d bytenews"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bytenews-postgres:
